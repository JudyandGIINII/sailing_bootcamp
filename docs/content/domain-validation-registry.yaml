schema_version: 1
registry_version: 0-draft
status: unapproved
scope: training-sloop-v1 mandatory L01-L05 on synthetic virtual water
allowed_dispositions:
  - assumption
  - partially_validated
  - validated
  - rejected
release_rule: >-
  A lesson is release-ineligible unless its referenced validation record is validated
  and all dependent P1 approval artifacts are approved, and its scenario/model/
  boat-profile/contract/coordinate/determinism/comparison-policy versions are all
  concrete, mutually compatible, and approved (not TBD or draft). assumption,
  partially_validated, rejected, missing, stale, draft, TBD, or otherwise unapproved
  records or version bindings block release.
common_policy:
  simulation_only: true
  real_navigation_or_safety_authority: prohibited
  local_only_replay_and_telemetry: true
  server_transmission_before_separate_approval: prohibited
  no_numeric_thresholds_in_this_draft: true
  validated_requires_non_draft_compatible_version_bindings: true
required_record_fields:
  - validation_record_id
  - lesson_id
  - claim_or_assumption
  - source_or_evidence_gap_reason
  - scenario_version
  - model_version
  - boat_profile_version
  - contract_version
  - coordinate_contract_version
  - determinism_contract_version
  - comparison_policy_version
  - coverage
  - reviewer
  - review_date
  - disposition
records:
  - validation_record_id: VR-L01-v0
    lesson_id: L01
    claim_or_assumption: >-
      Relative-wind/course fixture, course-maintenance semantics, recoverable deviation,
      boundary predicate, score and retry comparison semantics for training-sloop-v1.
    source_or_evidence_gap_reason: No approved sailing-domain evidence is attached; draft simulation assumptions only.
    scenario_version: l01-scenario-v0-draft
    model_version: training-sloop-model-v0-draft
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - true/apparent-wind relationship
      - heading/COG/course objective semantics
      - helm correction and recoverable deviation
      - course boundary and score/retry semantics
    reviewer: null
    review_date: null
    disposition: assumption
  - validation_record_id: VR-L02-v0
    lesson_id: L02
    claim_or_assumption: >-
      Representative main/jib configuration, trim response, polar effect, stable-trim,
      recovery, score and retry comparison semantics for training-sloop-v1.
    source_or_evidence_gap_reason: No approved sailing-domain evidence is attached; draft simulation assumptions only.
    scenario_version: l02-scenario-v0-draft
    model_version: training-sloop-model-v0-draft
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - main and jib trim feedback
      - polar and stability assumptions
      - recoverable unstable state
      - speed non-offsettable safety invariant
    reviewer: null
    review_date: null
    disposition: assumption
  - validation_record_id: VR-L03-v0
    lesson_id: L03
    claim_or_assumption: >-
      Gust/wave episode effects, reef or sail-reduction meaning, terminal/recoverable
      boundary, safety-first score and retry semantics for training-sloop-v1.
    source_or_evidence_gap_reason: No approved sailing-domain evidence is attached; draft simulation assumptions only.
    scenario_version: l03-scenario-v0-draft
    model_version: training-sloop-model-v0-draft
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - gust and wave cues
      - reef timing/effect assumptions
      - simulated safety recovery and terminality
      - conservative mitigation pass eligibility
    reviewer: null
    review_date: null
    disposition: assumption
  - validation_record_id: VR-L04-v0
    lesson_id: L04
    claim_or_assumption: >-
      Current-to vector composition, heading/COG and STW/SOG divergence, drift,
      mark acceptance, recovery, score and retry comparison semantics.
    source_or_evidence_gap_reason: No approved sailing-domain evidence is attached; draft simulation assumptions only.
    scenario_version: l04-scenario-v0-draft
    model_version: training-sloop-model-v0-draft
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - current-to direction convention
      - vector composition and drift
      - mark acceptance and recoverable miss
      - slower valid correction acceptance
    reviewer: null
    review_date: null
    disposition: assumption
  - validation_record_id: VR-L05-v0
    lesson_id: L05
    claim_or_assumption: >-
      Synthetic tide/depth/visibility timeline, depth datum, draft and clearance,
      pass/wait/return policy, terminality, score and retry comparison semantics.
    source_or_evidence_gap_reason: No approved sailing-domain evidence is attached; draft simulation assumptions only.
    scenario_version: l05-scenario-v0-draft
    model_version: training-sloop-model-v0-draft
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - synthetic tide and depth datum
      - draft and clearance assumptions
      - visibility and route state
      - pass/wait/return and terminality semantics
    reviewer: null
    review_date: null
    disposition: assumption
  - validation_record_id: VR-POLAR-v0
    lesson_id:
      - L04
      - L06
    claim_or_assumption: >-
      Synthetic 8x6 polar table mapping (apparent wind angle, true wind speed) to a
      target speed through water for training-sloop-v1, adjusted by declared
      sail-trim and reef correction factors, and composed with a synthetic
      current-to vector to give ground-relative velocity. A synthetic semidiurnal
      tide additionally drives an under-keel clearance of
      (seabed depth + tide - draft) and its threshold events. Both the current and
      the tide derive from the real date and time the player starts a session via a
      simplified single-sinusoid shape sharing one phase, with the stream taken as the tide's rate of change so slack water falls at high and low water: not real tide data, harmonic constants,
      charted depth, soundings, a datum, an under-keel safety margin, a trim guide,
      a reefing threshold, or any navigational prediction.
    source_or_evidence_gap_reason: >-
      No approved sailing-domain evidence is attached. Every value below is an
      invented educational assumption, not a measured or approved constant. Polar
      values are chosen for monotonicity in wind speed and a mid-angle maximum.
      The declared constants are: semidiurnal period 12.42 h; maximum current
      1.5 m/s; trim range 0-1 with step 0.125 and a declared optimal trim of
      (1 - |apparent wind angle| / pi); minimum trim efficiency 0.55; reef speed
      factor 0.75; tide amplitude 1.8 m; clearance caution threshold 1.5 m and
      danger threshold 0.5 m; seabed depth 3.5 m; draft 1.6 m. This record is
      boat-profile scoped and shared by every lesson bound to polar-kinematics-v5;
      it asserts no real hull performance, weather, route, tidal, depth, or safety
      behaviour.
    scenario_version: not-scenario-scoped
    model_version: polar-kinematics-v5
    boat_profile_version: training-sloop-v1
    contract_version: lesson-model-contract-v0-draft
    coordinate_contract_version: coordinate-contract-v1-draft
    determinism_contract_version: determinism-replay-contract-v1-draft
    comparison_policy_version: comparison-policy-v1-draft
    coverage:
      - polar target speed through water by apparent wind angle and true wind speed
      - declared synthetic sail-trim efficiency and reef correction factors applied to the polar base speed
      - declared synthetic semidiurnal tide height, under-keel clearance (depth + tide - draft), and once-only clearance threshold events
      - one-tick apparent wind lag used as the polar input
      - synthetic current-to vector and ground-relative velocity composition
      - STW/SOG and heading/COG separation and drift angle
      - session-start-time-derived synthetic semidiurnal current (deriveSyntheticCurrent)
    reviewer: null
    review_date: null
    disposition: assumption
